[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semi-controlled-analysis"
version = "1.0.0"
description = "Analysis pipeline for semi-controlled social touch experiments — touch feature extraction, clustering, and receptive field mapping."
requires-python = ">=3.10"
authors = [
    {name = "Basil Duvernoy", email = "basil.duvernoy@gmail.com"},
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "scikit-image",
    "open3d>=0.19",
    "pyvista>=0.46",
    "pyvistaqt>=0.11",
    "trimesh>=4.7",
    "libigl",
    "PyQt5>=5.15",
    "prefect>=3.4",
    "pydantic>=2.11",
    "ruamel.yaml>=0.18",
    "PyYAML>=6.0",
    "openpyxl",
    "tqdm",
    "Pillow",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
